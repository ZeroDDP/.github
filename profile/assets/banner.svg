<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">ZeroDDP</title>
  <desc id="d">Student software development team, Tomsk Polytechnic University</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a00" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a00" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
      .sans { font-family: 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect x="0" y="318" width="1280" height="2" fill="url(#glow)"/>

  <!-- logo mark -->
  <rect x="88" y="104" width="56" height="56" rx="12" fill="#ff7a00"/>
  <path d="M104 120 L120 132 L104 144" fill="none" stroke="#0d1117" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="142" width="12" height="5" rx="2" fill="#0d1117"/>

  <text x="168" y="152" class="sans" font-size="64" font-weight="700" fill="#f0f3f6" letter-spacing="2">ZeroDDP</text>
  <text x="90" y="206" class="sans" font-size="24" fill="#9aa4b2">Student software development team</text>
  <text x="90" y="240" class="sans" font-size="20" fill="#6b7585">Tomsk Polytechnic University · ESITR</text>

  <!-- terminal card -->
  <g transform="translate(760 70)">
    <rect width="440" height="180" rx="12" fill="#0b0e14" stroke="#2a3140"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="20" r="6" fill="#febc2e"/>
    <circle cx="62" cy="20" r="6" fill="#28c840"/>
    <text x="24" y="66" class="mono" font-size="17" fill="#9aa4b2"><tspan fill="#ff7a00">$</tspan> synex connect prod-01</text>
    <text x="24" y="96" class="mono" font-size="17" fill="#28c840">✓ host key verified</text>
    <text x="24" y="126" class="mono" font-size="17" fill="#9aa4b2">cpu 32%  ram 44%  disk 39%</text>
    <text x="24" y="156" class="mono" font-size="17" fill="#9aa4b2"><tspan fill="#ff7a00">$</tspan> <tspan class="caret" fill="#f0f3f6">▍</tspan></text>
  </g>
</svg>
